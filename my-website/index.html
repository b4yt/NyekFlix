<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NyekFlix</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="preload" href="css/home.css" as="style">
  <link rel="preload" href="js/home.js" as="script">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="js/home.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: #111;
      border-bottom: 2px solid #e50914;
    }
    .navbar img {
      height: 50px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .search-bar {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
    }
    .banner {
      height: 60vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 2px 2px 4px #000;
    }
    .banner h1 {
      font-size: 3rem;
      color: white;
    }
    .row {
      padding: 1rem;
    }
    .list {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
    }
    .list img {
      height: 200px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .list img:hover {
      transform: scale(1.05);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      width: 80%;
      max-width: 900px;
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 10px;
      overflow: hidden;
    }
    .modal-body {
      display: flex;
      gap: 1rem;
    }
    .modal-body img {
      height: 300px;
      border-radius: 10px;
    }
    .modal-text h2 {
      color: #e50914;
    }
    .modal-text p {
      line-height: 1.6;
    }
    .stars {
      color: gold;
      font-size: 1.2rem;
    }
    .server-selector {
      margin-top: 1rem;
    }
    .footer {
      padding: 1rem;
      text-align: center;
      background-color: #111;
      margin-top: 2rem;
      border-top: 2px solid #e50914;
    }
    .footer-links a {
      color: #bbb;
      margin: 0 1rem;
      text-decoration: none;
    }
    .footer-links a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="navbar">
    <img src="your-path/nyekflix-logo.png" alt="NyekFlix Logo" />
    <div class="nav-links">
      <a href="index.html">Home</a>
      <input type="text" class="search-bar" placeholder="Search..." onfocus="openSearchModal()" />
    </div>
  </div>

  <div class="banner" id="banner">
    <h1 id="banner-title"></h1>
  </div>

  <div class="row">
    <h2>Trending Movies</h2>
    <div class="list" id="movies-list"></div>
  </div>

  <div class="row">
    <h2>Trending TV Shows</h2>
    <div class="list" id="tvshows-list"></div>
  </div>

  <div class="row">
    <h2>Trending Anime</h2>
    <div class="list" id="anime-list"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()" style="color: red; font-size: 2rem; cursor: pointer;">&times;</span>
      <div class="modal-body">
        <img id="modal-image" src="" alt="" />
        <div class="modal-text">
          <h2 id="modal-title"></h2>
          <div class="stars" id="modal-rating"></div>
          <p id="modal-description"></p>
        </div>
      </div>

      <div class="server-selector">
        <label for="server">Change Server:</label>
        <select id="server" onchange="changeServer()">
          <option value="vidsrc.cc">Vidsrc.cc</option>
          <option value="vidsrc.me">Vidsrc.me</option>
          <option value="player.videasy.net">Player.Videasy.net</option>
        </select>
      </div>
      <iframe id="modal-video" width="100%" height="315" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <div class="search-modal" id="search-modal">
    <span class="close" onclick="closeSearchModal()" style="color: red; font-size: 2rem; cursor: pointer;">&times;</span>
    <input type="text" id="search-input" placeholder="Search for a movie or show..." oninput="searchTMDB()" />
    <div class="results" id="search-results"></div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2025 NyekFlix. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Disclaimer</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </div>
    </div>
  </footer>

</body>
</html>
